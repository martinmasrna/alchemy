<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art styles, real colour</title>
<style>
  /* Comparison sheet. The chrome is the agreed dark palette so the art is judged where it
     will live. Only the illustration style varies. */
  :root {
    --bg: #0a0b0f; --plate: #14161d; --plate-2: #1d212b;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.28);
    --text: #eef0f5; --muted: #7b8294; --amber: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  svg { display: block; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.15; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 8px; max-width: 70ch; }
  h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; margin: 32px 0 12px; }

  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 12px 8px; text-align: center; vertical-align: middle; }
  thead th { font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); width: 22%; }
  thead th small { display: block; font-size: 12px; font-weight: 400; color: var(--muted);
    margin-top: 4px; line-height: 1.4; }
  tbody th { font-size: 14px; font-weight: 400; color: var(--muted); text-align: left; width: 90px; }
  tbody tr + tr td, tbody tr + tr th { border-top: 1px solid rgba(255,255,255,.05); }
  .big { display: grid; place-items: center; }
  .big svg { width: 76px; height: 76px; }

  .situ { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .col > .name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { background: var(--plate); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  /* Art gets 34px inside the same 44px well. Line work reads at 28; illustration does not. */
  .card .well { width: 44px; height: 44px; display: grid; place-items: center; }
  .card .well svg { width: 34px; height: 34px; }
  .card .n { font-size: 14px; line-height: 1.15; text-align: center; }
  .card.picked { border-color: var(--line-strong); background: var(--plate-2); }

  .heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .hero { background: var(--plate); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 12px; text-align: center; }
  .hero .mark { display: grid; place-items: center; }
  .hero .mark svg { width: 112px; height: 112px; }
  .hero .n { font-size: 20px; font-weight: 600; margin-top: 12px; }
  .hero .blurb { font-size: 14px; color: var(--muted); margin-top: 8px; text-align: left; }
  @media (max-width: 900px) { .situ, .heroes { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap"></div>
<script type="module">
  import { realStyles as artStyles, realNotes as artNotes, realSubjects as artSubjects, GOU_DEFS } from "../../../../_context/icon-art-real.js";
  document.body.insertAdjacentHTML("afterbegin", GOU_DEFS);
  const names = Object.keys(artStyles);
  const wrap = document.querySelector(".wrap");

  const head = `<h1>Four art styles, one palette</h1>
    <p class="lede">Colour is no longer a variable. Every column draws from the same palette, and that palette is what a person already expects a thing to be: sea blue, land green, a star yellow-white. Not what it actually is, what someone recognises without being told.</p>
    <p class="lede">So the only thing that varies here is the art style. If Earth is not obviously Earth in a column, that column has failed at its job rather than chosen a mood.</p>`;

  const matrix = `<h2>The illustration, at 76px</h2><table>
    <thead><tr><th style="width:90px"></th>${names.map(n => `<th>${n}<small>${artNotes[n]}</small></th>`).join("")}</tr></thead>
    <tbody>${artSubjects.map(([id, label]) => `<tr><th>${label}</th>${
      names.map(n => `<td><span class="big">${artStyles[n][id]}</span></td>`).join("")
    }</tr>`).join("")}</tbody></table>`;

  const situ = `<h2>In the grid, at 34px, where the session is actually spent</h2><div class="situ">${
    names.map(n => `<div class="col"><div class="name">${n}</div><div class="grid">${
      artSubjects.map(([id, label], i) => `<div class="card${i === 2 ? " picked" : ""}">
        <span class="well">${artStyles[n][id]}</span><span class="n">${label}</span></div>`).join("")
    }</div></div>`).join("")}</div>`;

  const heroes = `<h2>At discovery size, which is what the art is really for</h2><div class="heroes">${
    names.map(n => `<div class="hero"><div class="mark">${artStyles[n].star}</div><div class="n">Star</div>
      <div class="blurb">The cloud squeezes until the middle gets so hot that atoms start fusing. It ignites.</div></div>`).join("")
  }</div>`;

  wrap.innerHTML = head + matrix + situ + heroes;
</script>
</body>
</html>
