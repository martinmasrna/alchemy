<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../_context/lab.css">
<style>
  /* ---------------------------------------------------------------
     DRAWN — what both Little Alchemy games did: one hand draws the whole
     set. The marks are line geometry in a single stroke weight, and they
     are currentColor, so the palette drives the icon instead of fighting
     it. Colour finally belongs to us.
     Sizes and steps from _context/system.md.
     --------------------------------------------------------------- */
  .phone {
    --bg: #0a0b0f;
    --plate: #14161d;
    --plate-2: #1d212b;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.28);
    --text: #eef0f5;
    --muted: #7b8294;
    --ink: #aeb6c6;        /* the icon's resting colour */
    --amber: #f0b429;      /* credits only */
    --bad: #e8756f;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .phone * { box-sizing: border-box; }
  .app { padding: 16px 16px 32px; }
  svg { display: block; }

  header { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 12px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.15; color: var(--muted); }
  .meta { display: flex; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .credits { color: var(--amber); }

  .goalrow { margin-bottom: 16px; }
  .target { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 14px; background: var(--plate); }
  .target svg { width: 20px; height: 20px; }
  .target .cn { font-weight: 600; }
  .how { background: var(--plate-2); border: 0; color: var(--muted); font: inherit; font-size: 12px;
    border-radius: 999px; padding: 4px 10px; cursor: pointer; }

  .bench { background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: grid; grid-template-columns: 1fr 20px 1fr 20px 1fr; align-items: center; gap: 4px; }
  .op { text-align: center; color: var(--muted); font-size: 14px; }
  .slot { height: 76px; border-radius: 8px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; text-align: center; padding: 0 4px;
    background: rgba(255,255,255,.02); border: 1px dashed var(--line); color: var(--ink); }
  .slot svg { width: 28px; height: 28px; }
  .slot .n { font-size: 12px; color: var(--text); }
  .slot .ph { font-size: 12px; color: var(--muted); }
  .slot.filled { border-style: solid; border-color: var(--line-strong); background: var(--plate-2); color: var(--text); }
  .slot.dud { border-color: var(--bad); border-style: solid; }
  .slot.dud .n { color: var(--bad); }

  .label { margin: 24px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { background: var(--plate); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .well { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
  .well svg { width: 28px; height: 28px; }
  .card .n { font-size: 14px; line-height: 1.15; text-align: center; }
  /* Selection can be a colour now, because the icons no longer bring their own. */
  .card.picked { border-color: var(--line-strong); background: var(--plate-2); }
  .card.picked .well { color: var(--text); }

  .chips { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--line);
    border-radius: 999px; padding: 6px 10px; font-size: 14px; max-width: 100%; color: var(--ink); }
  .chip .cn { color: var(--text); }
  .chip > svg { width: 18px; height: 18px; }
  .chip .r { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .ii { display: inline-flex; align-items: center; gap: 4px; }
  .ii svg { width: 14px; height: 14px; }

  .squares { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .sq { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.035);
    display: grid; place-items: center; color: #545a66; font-size: 14px; }
  .sq.armed { background: var(--plate-2); border: 1px solid var(--line-strong); color: var(--text);
    font-size: 10px; grid-column: span 2; aspect-ratio: auto; height: 100%; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-top: 32px; color: var(--muted); font-size: 12px; }
  footer .acts { display: flex; gap: 8px; }
  footer button { background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; }

  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .backdrop { position: absolute; inset: 0; background: rgba(6,7,10,.985); backdrop-filter: blur(3px); }
  .who { position: relative; text-align: center; max-width: 330px; }
  .pair { font-size: 14px; color: var(--muted); display: flex; justify-content: center; gap: 6px; }
  /* The mark can be huge without turning into a cartoon, because it is line art. */
  .bigicon { display: grid; place-items: center; margin: 16px 0 12px; color: var(--amber); }
  .bigicon svg { width: 84px; height: 84px; stroke-width: 1.1; }
  .name { font-size: 28px; font-weight: 600; line-height: 1.15; }
  .blurb { font-size: 16px; line-height: 1.4; margin-top: 16px; text-align: left; color: #c9cedb; }
  .credit { display: inline-block; margin-top: 24px; font-size: 12px; color: var(--amber);
    border: 1px solid var(--amber); border-radius: 999px; padding: 4px 12px; }
</style>
</head>
<body>
<script type="module">
  import { lab } from "../../_context/screen.js";
  import { mark } from "../../_context/icons.js";
  lab("Drawn",
    "What both Little Alchemy games did: one hand draws the whole set. Line geometry in a single stroke weight, every mark in currentColor, so the palette drives the icons instead of fighting them. The marks also say things emoji cannot: hydrogen is one, helium is two, carbon is a hexagon, oxygen is a bonded pair, light is a wave.",
    { icon: (item) => mark(item.id) });
</script>
</body>
</html>
