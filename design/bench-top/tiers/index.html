<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../_context/lab.css">
<style>
  /* ---------------------------------------------------------------
     TIERS — the emoji are drained to grey and colour is given back as
     information: where a thing belongs in the world. Violet is what you
     started with, blue is space, green is the planet. The grid becomes a
     map of how far you have come. Full colour returns only at a discovery.
     Sizes and steps from _context/system.md.
     --------------------------------------------------------------- */
  .phone {
    --bg: #070910;
    --plate: #101422;
    --plate-2: #171d2e;
    --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.2);
    --text: #e9ecf3;
    --muted: #767e93;
    --seed: #a08cf0;
    --cosmos: #5aa6e8;
    --world: #46bf9a;
    --bad: #e8756f;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .phone * { box-sizing: border-box; }
  .app { padding: 16px 16px 32px; }

  header { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 12px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.15; color: var(--muted); }
  .meta { display: flex; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .credits { color: var(--text); }

  .goalrow { margin-bottom: 16px; }
  .target { display: inline-flex; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--world) 45%, transparent);
    border-radius: 999px; padding: 6px 8px 6px 6px; font-size: 14px; background: color-mix(in srgb, var(--world) 10%, var(--plate)); }
  .target .i { font-size: 20px; line-height: 1; }
  .target .cn { font-weight: 600; color: var(--world); }
  .how { background: rgba(255,255,255,.06); border: 0; color: var(--muted); font: inherit; font-size: 12px;
    border-radius: 999px; padding: 4px 10px; cursor: pointer; }

  .bench { background: var(--plate); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: grid; grid-template-columns: 1fr 20px 1fr 20px 1fr; align-items: center; gap: 4px; }
  .op { text-align: center; color: var(--muted); font-size: 14px; }
  .slot { height: 76px; border-radius: 8px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; text-align: center; padding: 0 4px;
    background: rgba(255,255,255,.02); border: 1px dashed var(--line); }
  .slot .i { font-size: 28px; line-height: 1; filter: grayscale(1) brightness(1.25) contrast(.95); }
  .slot .n { font-size: 12px; color: var(--text); }
  .slot .ph { font-size: 12px; color: var(--muted); }
  .slot.filled { border-style: solid; border-color: var(--line-strong); background: var(--plate-2); }
  .slot.dud { border-color: var(--bad); border-style: solid; }
  .slot.dud .n { color: var(--bad); }

  .label { margin: 24px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--plate); }
  /* Colour carries the tier, so it has to survive on the card, the name and nothing else. */
  .card[data-tier="seed"]   { --hue: var(--seed); }
  .card[data-tier="cosmos"] { --hue: var(--cosmos); }
  .card[data-tier="world"]  { --hue: var(--world); }
  .card { background: color-mix(in srgb, var(--hue) 9%, var(--plate));
          border-color: color-mix(in srgb, var(--hue) 22%, transparent); }
  .well { width: 44px; height: 44px; display: grid; place-items: center; }
  /* Drained, then lifted: raw grayscale emoji go muddy on a dark ground. */
  .well .i { font-size: 26px; line-height: 1; filter: grayscale(1) brightness(1.35) contrast(.9); }
  .card .n { font-size: 14px; line-height: 1.15; text-align: center;
    color: color-mix(in srgb, var(--hue) 65%, #ffffff); }
  .card.picked { border-color: color-mix(in srgb, var(--hue) 75%, transparent);
    background: color-mix(in srgb, var(--hue) 20%, var(--plate)); }
  .card.picked .i { filter: none; }

  .chips { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--line);
    border-radius: 999px; padding: 6px 8px 6px 10px; font-size: 14px; max-width: 100%; }
  .chip .i { font-size: 18px; line-height: 1; filter: grayscale(1) brightness(1.3) contrast(.9); }
  /* Inline recipe emoji and the discovery's pair line get drained too, or half the screen
     stays in colour while the grid is grey. The goal's Earth is the one deliberate exception:
     it is the thing you are aiming at, so it keeps its colour. */
  .chip .r { color: var(--muted); font-size: 12px; filter: grayscale(1) brightness(1.15); }

  .squares { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .sq { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.035);
    display: grid; place-items: center; color: #4d5468; font-size: 14px; }
  .sq.armed { background: color-mix(in srgb, var(--cosmos) 22%, transparent);
    border: 1px solid var(--cosmos); color: #d6e8fa; font-size: 10px;
    grid-column: span 2; aspect-ratio: auto; height: 100%; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-top: 32px; color: var(--muted); font-size: 12px; }
  footer .acts { display: flex; gap: 8px; }
  footer button { background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; }

  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .backdrop { position: absolute; inset: 0; background: rgba(4,6,12,.985); backdrop-filter: blur(3px); }
  .who { position: relative; text-align: center; max-width: 330px; }
  .pair { font-size: 14px; color: var(--muted); filter: grayscale(1) brightness(1.15); }
  /* The reward is colour: this is the only place a glyph is left alone. */
  .bigicon { font-size: 72px; line-height: 1; margin: 16px 0 8px; }
  .name { font-size: 28px; font-weight: 600; line-height: 1.15; color: var(--cosmos); }
  .blurb { font-size: 16px; line-height: 1.4; margin-top: 16px; text-align: left; color: #c7ccd8; }
  .credit { display: inline-block; margin-top: 24px; font-size: 12px; color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; }
</style>
</head>
<body>
<script type="module">
  import { lab } from "../../_context/screen.js";
  lab("Tiers", "The emoji are drained to grey and the colour is given back as information: violet is what you started with, blue is space, green is the planet. The grid reads as a map of how far you have come, and full colour returns only at a discovery.");
</script>
</body>
</html>
