<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitat, three ways</title>
<style>
  :root { --bg: #0a0b0f; --plate: #14161d; --plate-2: #1d212b;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.28);
    --text: #eef0f5; --muted: #7b8294; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  svg { display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.15; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 8px; max-width: 72ch; }
  h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; margin: 32px 0 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 9px 8px; text-align: center; vertical-align: middle; }
  thead th { font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); width: 30%; }
  thead th small { display: block; font-size: 12px; font-weight: 400; color: var(--muted);
    margin-top: 4px; line-height: 1.45; }
  tbody th { font-size: 14px; font-weight: 400; color: var(--muted); text-align: left; width: 84px; }
  tbody tr + tr td, tbody tr + tr th { border-top: 1px solid rgba(255,255,255,.05); }
  .big { display: grid; place-items: center; }
  .big svg { width: 74px; height: 74px; }
  .situ { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .col > .name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .card { background: var(--plate); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .card .well { width: 40px; height: 40px; display: grid; place-items: center; }
  .card .well svg { width: 34px; height: 34px; }
  .card .n { font-size: 11px; line-height: 1.15; text-align: center; color: var(--muted); }
  .card.picked { border-color: var(--line-strong); background: var(--plate-2); }
  @media (max-width: 860px) { .situ { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap"></div>
<script type="module">
  import { habitatX, habitatXNotes, subjects, HX_DEFS } from "../../_context/icon-art-habitat-x.js";
  document.body.insertAdjacentHTML("afterbegin", HX_DEFS);
  const names = ["own", "editorial", "glass"];
  const label = { own: "habitat (as it won)", editorial: "habitat as editorial", glass: "habitat as glass" };
  const wrap = document.querySelector(".wrap");

  wrap.innerHTML = `
    <h1>Habitat, rendered three ways</h1>
    <p class="lede">The final three were not answering the same question. Editorial and glass are both answers to how a thing is rendered. Habitat answers what else is in the frame, and its own rendering is a modelled solid that happens to look like clay.</p>
    <p class="lede">So the depiction is separable, and here it is separated. The context is identical in all three columns: the same stars beside the star, the same ripple under the drop, the same sun beside the Earth, the same long shadow under the person. Only the paint changes.</p>
    <p class="lede">One thing had to change with the ground rather than the paint. A glow under a fire says nothing on paper, so in the editorial column the fire keeps its logs and loses its halo, and the star's white companions become dark specks. Context has to be drawn in whatever ink the surface takes.</p>

    <h2>At 74px</h2>
    <table>
      <thead><tr><th style="width:84px"></th>${names.map((n) => `<th>${label[n]}<small>${habitatXNotes[n]}</small></th>`).join("")}</tr></thead>
      <tbody>${subjects.map(([id, name]) => `<tr><th>${name}</th>${
        names.map((n) => `<td><span class="big">${habitatX[n][id]}</span></td>`).join("")
      }</tr>`).join("")}</tbody>
    </table>

    <h2>All twelve in the grid, at 34px</h2>
    <div class="situ">${names.map((n) => `<div class="col"><div class="name">${label[n]}</div><div class="grid">${
      subjects.map(([id, name], i) => `<div class="card${i === 4 ? " picked" : ""}">
        <span class="well">${habitatX[n][id]}</span><span class="n">${name}</span></div>`).join("")
    }</div></div>`).join("")}</div>`;
</script>
</body>
</html>
