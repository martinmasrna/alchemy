<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky · round 2</title>
<style>
  :root { color-scheme: dark; --bg: #16171c; --text: #eceef3; --muted: #8e93a3; --line: #33363f; --accent: #ffcf70; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding-inline: 24px; padding-block: 24px 48px; }
  header { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .group { display: flex; gap: 4px; }
  .group button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .group button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
  .row { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; width: 390px; max-width: 100%; }
  iframe { display: block; width: 390px; height: 844px; max-width: 100%; border: 0; border-radius: 28px; box-shadow: 0 0 0 1px var(--line), 0 24px 48px #0008; background: #000; }
  figcaption { margin-top: 16px; }
  figcaption b { font-size: 17px; }
  figcaption p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sky · round 2</h1>
    <div class="group" id="axes" role="group" aria-label="What varies"></div>
    <div class="group" id="states" role="group" aria-label="State"></div>
  </header>
  <div class="row" id="row"></div>
</div>
<script>
  // Each axis varies one part of Sky; everything else stays as round 1 left it.
  const AXES = {
    bench: { label: "Bench", variants: [
      ["", "Pane", "Round 1: a pane of dark glass with three square sockets."],
      ["rings", "Rings", "No pane. Three round sockets on the sky itself; the result is the one that glows."],
      ["slim", "Slim", "The same glass at half the height, without names. Pinned, it covers less of the grid."],
    ] },
    dark: { label: "Still dark", variants: [
      ["", "Row", "Round 1: a row of unlit stars under the named things."],
      ["field", "Field", "The same stars scattered at different sizes and brightness, like a patch of sky."],
      ["grid", "In the grid", "The grid carries on past what you own: a named thing as a ghost, the rest as unlit stars, one per cell."],
    ] },
    head: { label: "Header", variants: [
      ["", "Bar", "Round 1: the goal with a progress bar under it."],
      ["ring", "Ring", "Progress is a ring round the goal; no bar, and the recipe hint is plain text."],
    ] },
  };
  const STATES = [["", "Mid-play"], ["state=picked", "Picked"], ["state=dud", "Dud"], ["at=late", "Late"]];
  let axis = "bench", state = "";
  try { axis = localStorage.getItem("sky2-axis") || axis; } catch {}
  const btn = (label, on, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", on); b.onclick = fn; return b; };
  function render() {
    const axes = document.getElementById("axes"), states = document.getElementById("states"), row = document.getElementById("row");
    axes.replaceChildren(...Object.entries(AXES).map(([k, a]) => btn(a.label, k === axis, () => { axis = k; try { localStorage.setItem("sky2-axis", k); } catch {} render(); })));
    states.replaceChildren(...STATES.map(([q, l]) => btn(l, q === state, () => { state = q; render(); })));
    row.innerHTML = AXES[axis].variants.map(([v, name, text]) => {
      const params = [v && `${axis}=${v}`, state].filter(Boolean).join("&");
      return `<figure><iframe src="./${params ? "?" + params : ""}"></iframe><figcaption><b>${name}</b><p>${text}</p></figcaption></figure>`;
    }).join("");
  }
  render();
</script>
</body>
</html>
