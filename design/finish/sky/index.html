<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finish · Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
  /* Sky: the screen is the night the icons already live in. Nothing is boxed; things float on
     the dark, and what is still undiscovered is stars that have not lit yet. */
  :root {
    color-scheme: dark;
    --bg: #070913; --bg-2: #0e1428; --glass: rgba(14, 19, 38, .9); --line: rgba(160, 180, 255, .12);
    --text: #eef0fa; --muted: #8a92b4; --warm: #ffcf70; --warm-soft: rgba(255, 190, 90, .22); --bad: #ff6f7d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 Outfit, system-ui, sans-serif; }
  :root {
    --sky:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent), radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent),
      radial-gradient(1px 1px at 55% 34%, #fff4 50%, transparent), radial-gradient(1px 1px at 30% 62%, #fff5 50%, transparent),
      radial-gradient(1px 1px at 88% 48%, #fff4 50%, transparent), radial-gradient(1px 1px at 8% 84%, #fff5 50%, transparent),
      radial-gradient(1.5px 1.5px at 66% 76%, #fff6 50%, transparent), radial-gradient(1px 1px at 42% 92%, #fff4 50%, transparent),
      radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%);
    --sky-size: 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 100vw 100vh;
  }
  body { background: var(--sky); background-size: var(--sky-size); background-attachment: fixed; background-color: var(--bg); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }
  .hex { width: 11px; height: 11px; display: inline-block; vertical-align: -1px; }
  #app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: env(safe-area-inset-top) 48px; }

  .top { padding-block: 16px 8px; }
  .bar { display: flex; align-items: center; gap: 12px; position: relative; }
  .world { flex: 1; margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .credits { display: inline-flex; align-items: center; gap: 4px; color: var(--warm); font-weight: 600; font-variant-numeric: tabular-nums; }
  .menu { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; border-radius: 50%; }
  .menu i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .sheet { position: absolute; right: 0; top: 40px; z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 8px;
    background: #121831; border: 1px solid var(--line); border-radius: 12px; min-width: 160px; box-shadow: 0 12px 32px #0008; }
  .sheet span { color: var(--muted); font-size: 13px; padding: 6px 10px; }
  .sheet button { text-align: left; padding: 8px 10px; border-radius: 8px; }
  .sheet button:hover { background: #fff1; }

  .summit { display: grid; grid-template-columns: 56px 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 12px; row-gap: 8px; margin-top: 12px; }
  .summit > .ic { grid-row: span 2; width: 56px; height: 56px; filter: drop-shadow(0 0 14px rgba(90, 170, 255, .35)); }
  .summit > .ic svg { width: 100%; height: 100%; }
  .goal { display: flex; align-items: baseline; gap: 8px; }
  .goal .k { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .goal .v { font-size: 24px; font-weight: 600; line-height: 1.1; }
  .goal { grid-area: 1 / 2; }
  .summit .hint { grid-area: 1 / 3; justify-self: end; white-space: nowrap; font-size: 13px; color: var(--muted); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .progress { grid-area: 2 / 2 / 3 / 4; display: flex; align-items: center; gap: 12px; }
  .progress .num { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress .num b { color: var(--text); font-weight: 600; }
  .track { flex: 1; height: 3px; border-radius: 3px; background: #ffffff14; overflow: hidden; }
  .track i { display: block; height: 100%; background: linear-gradient(90deg, #7fb6ff, var(--warm)); border-radius: 3px; }

  /* The bench floats over the sky and stays: a pane of dark glass with three sockets. */
  .bench { position: sticky; top: 8px; z-index: 10; margin-top: 16px; display: grid; grid-template-columns: 1fr 16px 1fr 16px 1fr;
    align-items: center; gap: 4px; padding: 12px; border-radius: 20px; background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 12px 32px #0006; }
  .op { text-align: center; color: var(--muted); font-size: 16px; }
  .slot { height: 84px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: radial-gradient(60% 60% at 50% 45%, #ffffff08, transparent), #05070f80; box-shadow: inset 0 2px 8px #000a, inset 0 0 0 1px #ffffff0a; }
  .slot .ic { width: 44px; height: 44px; }
  .slot .ic svg { width: 100%; height: 100%; }
  .slot .nm { font-size: 12px; color: var(--muted); }
  .slot.r { box-shadow: inset 0 2px 8px #000a, inset 0 0 0 1px rgba(255, 207, 112, .2); }
  .slot.r:not(.full)::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warm); opacity: .35; box-shadow: 0 0 12px var(--warm); }
  .bench.found .slot.r { box-shadow: inset 0 0 0 1px var(--warm), 0 0 24px var(--warm-soft); }
  .bench.dud .slot.r { box-shadow: inset 0 0 0 1px var(--bad), 0 0 20px rgba(255, 111, 125, .25); }
  .bench.dud .slot.r::after { content: "nothing"; width: auto; height: auto; background: none; box-shadow: none; opacity: 1; color: var(--bad); font-size: 13px; }

  .items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; margin-top: 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; border-radius: 16px; position: relative; transition: transform .12s; }
  .item .ic { width: 52px; height: 52px; transition: transform .18s; }
  .item .ic svg { width: 100%; height: 100%; }
  .item .nm { font-size: 13px; color: #cfd4ea; text-align: center; line-height: 1.15; }
  .item:active { transform: scale(.94); }
  .item::before { content: ""; position: absolute; left: 50%; top: 58px; width: 56px; height: 12px; margin-left: -28px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--warm-soft), transparent); opacity: 0; transition: opacity .18s; }
  .item.picked .ic { transform: translateY(-6px) scale(1.06); }
  .item.picked::before { opacity: 1; }
  .item.picked .nm { color: var(--warm); }
  .item.new { animation: pop .45s; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: none; opacity: 1; } }

  .dark { margin-top: 32px; }
  .lbl { margin: 0 0 12px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .named { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding-block: 8px; font-size: 14px; }
  .named .ic { width: 28px; height: 28px; }
  .named .ic svg { width: 100%; height: 100%; }
  .named > .nm { font-weight: 600; }
  .named .eq, .named .plus { color: var(--muted); }
  .rec { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .rec .ic { width: 22px; height: 22px; }
  .named .hint { font-size: 13px; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .marks { display: flex; flex-wrap: wrap; gap: 14px 18px; padding-block: 16px 8px; }
  .mark { width: 20px; height: 20px; border-radius: 50%; position: relative; }
  .mark::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #aab4d8; opacity: .35; box-shadow: 0 0 6px #aab4d855; }
  .mark:nth-child(3n)::before { inset: 8px; opacity: .25; }
  .mark:nth-child(4n+1)::before { inset: 6px; }
  .mark.armed { width: auto; height: 28px; padding-inline: 12px; border-radius: 999px; color: var(--warm); font-size: 13px; border: 1px solid rgba(255, 207, 112, .4); }
  .mark.armed::before { display: none; }

  /* ---------- round 2 variants, switched by ?bench= ?dark= ?head= ---------- */

  /* bench=rings: no pane. Three sockets on the sky itself, the result the one that glows. The
     sticky strip carries the same fixed sky as the page, so it has no visible edge. */
  [data-bench="rings"] .bench { top: 0; margin-inline: -16px; padding: 12px 16px 28px; border: 0; border-radius: 0; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none; grid-template-columns: 1fr 16px 1fr 16px 1.2fr; justify-items: center;
    background: var(--sky); background-size: var(--sky-size); background-attachment: fixed;
    -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }
  [data-bench="rings"] .slot { width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #ffffff0a, #03050c 70%);
    box-shadow: inset 0 2px 8px #000c, 0 0 0 1px var(--line); position: relative; }
  [data-bench="rings"] .slot .nm { position: absolute; top: calc(100% + 4px); white-space: nowrap; }
  [data-bench="rings"] .slot.r { width: 88px; height: 88px; box-shadow: inset 0 2px 8px #000c, 0 0 0 1px rgba(255, 207, 112, .35), 0 0 28px rgba(255, 190, 90, .12); }
  [data-bench="rings"] .slot.r .ic { width: 52px; height: 52px; }
  [data-bench="rings"] .bench.found .slot.r { box-shadow: 0 0 0 1.5px var(--warm), 0 0 36px rgba(255, 190, 90, .4); }
  [data-bench="rings"] .bench.dud .slot.r { box-shadow: 0 0 0 1.5px var(--bad), 0 0 28px rgba(255, 111, 125, .3); }

  /* bench=slim: the same glass, half the height. The names go; the icons say it. */
  [data-bench="slim"] .bench { padding: 6px 10px; border-radius: 999px; grid-template-columns: 1fr 14px 1fr 14px 1fr; }
  [data-bench="slim"] .slot { height: 56px; border-radius: 999px; }
  [data-bench="slim"] .slot .ic { width: 40px; height: 40px; }
  [data-bench="slim"] .slot .nm { display: none; }
  [data-bench="slim"] .bench.dud .slot.r::after { font-size: 12px; }

  /* dark=field: the unlit stars scattered like a patch of sky rather than laid in a row. */
  [data-dark="field"] .marks { gap: 18px 22px; padding-block: 16px 16px; }
  [data-dark="field"] .mark::before { inset: auto; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); opacity: var(--o); }
  [data-dark="field"] .mark.armed { transform: none !important; }

  /* dark=grid: the rest of the world continues the grid as unlit stars, one per thing left. */
  [data-dark="grid"] .items .mark, [data-dark="grid"] .named.cell { height: 88px; width: auto; border-radius: 16px; }
  [data-dark="grid"] .items .mark::before { inset: auto; left: 50%; top: 34px; width: 5px; height: 5px; margin-left: -2.5px; }
  [data-dark="grid"] .items .mark:nth-child(3n)::before { width: 4px; height: 4px; }
  [data-dark="grid"] .named.cell { flex-direction: column; justify-content: flex-start; gap: 4px; padding-block: 8px 0; flex-wrap: nowrap; }
  [data-dark="grid"] .named.cell > .ic { width: 44px; height: 44px; opacity: .3; filter: grayscale(1) brightness(1.5); }
  [data-dark="grid"] .named.cell > .nm { font-size: 13px; font-weight: 500; }
  [data-dark="grid"] .named.cell .eq, [data-dark="grid"] .named.cell .plus, [data-dark="grid"] .named.cell .rec > span:not(.ic) { display: none; }
  [data-dark="grid"] .named.cell .rec { gap: 2px; }
  [data-dark="grid"] .named.cell .rec .ic { width: 16px; height: 16px; }
  [data-dark="grid"] .named.cell .hint { font-size: 11px; padding: 2px 8px; }
  [data-dark="grid"] .items .mark.armed { height: 88px; border: 1px solid rgba(255, 207, 112, .4); border-radius: 16px; padding: 4px; font-size: 12px; line-height: 1.2; }

  /* head=ring: progress is a ring around the goal, and the count sits under its name. */
  [data-head="ring"] .summit { grid-template-columns: 72px 1fr auto; row-gap: 2px; }
  [data-head="ring"] .summit > .ic { width: 72px; height: 72px; padding: 10px; position: relative; filter: none; }
  [data-head="ring"] .summit > .ic::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--warm) calc(var(--p) * 1turn), #ffffff14 0);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
  [data-head="ring"] .summit > .ic svg { filter: drop-shadow(0 0 10px rgba(90, 170, 255, .35)); }
  [data-head="ring"] .goal { align-self: end; }
  [data-head="ring"] .progress { grid-area: 2 / 2 / 3 / 3; align-self: start; }
  [data-head="ring"] .track { display: none; }
  [data-head="ring"] .summit .hint { grid-area: 1 / 3 / 3 / 4; align-self: center; border: 0; padding: 0; font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mount } from "../mock.js";
  const q = new URLSearchParams(location.search);
  for (const k of ["bench", "dark", "head"]) if (q.get(k)) document.documentElement.dataset[k] = q.get(k);
  // A fixed jitter per star, so the field is the same on every render.
  const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
  const field = (i) => {
    const s = 3 + Math.round(rnd(i, 1) * 4);
    return `--s:${s}px; --o:${(0.2 + rnd(i, 2) * 0.35).toFixed(2)}; transform: translate(${Math.round((rnd(i, 3) - .5) * 20)}px, ${Math.round((rnd(i, 4) - .5) * 16)}px)`;
  };
  mount({
    darkLabel: (n) => `${n} still dark`,
    darkInGrid: q.get("dark") === "grid",
    markStyle: q.get("dark") === "field" ? field : () => "",
  });
</script>
</body>
</html>
