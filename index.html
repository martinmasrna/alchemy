<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Alchemy</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151924; --panel-2: #1c2130; --line: #2a3145;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #f5c451; --good: #6fd08c; --bad: #e07a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; user-select: none; overflow-x: hidden; }
  .slot, .target, footer span { min-width: 0; }
  footer { flex-wrap: wrap; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .meta { display: flex; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header .credits { color: var(--accent); }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .label .sub { text-transform: none; letter-spacing: 0; margin-left: 6px; opacity: .7; }
  .hiddenwrap { margin-top: 22px; }
  .hiddenwrap .targets { margin: 8px 0 10px; }
  .squares { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
  .sq { aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; cursor: pointer; background: var(--panel); }
  .sq.armed { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--panel-2); }
  .sq.armed span::before { content: "⬡ "; }

  .goal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .targets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .target { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px dashed var(--line); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 14px; }
  .target.summit { border-color: var(--accent); color: var(--accent); }
  .target button { background: transparent; color: var(--muted); border: 0; font-size: 12px; padding: 2px 6px; cursor: pointer; }
  .target .recipe { color: var(--text); font-size: 13px; }

  .bench { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 14px 0 8px; }
  .slot { height: 64px; border: 1px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .slot.filled { border-style: solid; background: var(--panel); color: var(--text); }
  .slot .icon { font-size: 24px; }
  .plus { color: var(--muted); font-size: 22px; }
  .bench.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .hints { display: flex; gap: 8px; margin: 0 0 10px; min-height: 34px; }
  .hints button { flex: 1; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
  .hints button:disabled { opacity: .35; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 8px; text-align: center; cursor: pointer; position: relative; transition: transform .08s, opacity .15s; }
  .card:active { transform: scale(.96); }
  .card .icon { font-size: 28px; line-height: 1.1; }
  .card .name { font-size: 13px; margin-top: 4px; }
  .card.selected { border-color: var(--accent); background: var(--panel-2); }
  .card.tried { opacity: .35; }
  .card.made::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .card.new { animation: pop .4s; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .overlay { position: fixed; inset: 0; background: rgba(5,6,10,.85); display: none; align-items: center; justify-content: center; padding: 24px; }
  .overlay.show { display: flex; }
  .reveal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; max-width: 420px; width: 100%; text-align: center; animation: pop .35s; }
  .reveal .icon { font-size: 64px; }
  .reveal h2 { margin: 8px 0 4px; font-size: 24px; }
  .reveal .made { color: var(--muted); font-size: 13px; }
  .reveal p { color: var(--text); margin: 14px 0 18px; text-align: left; }
  .reveal.summit { border-color: var(--accent); }
  .reveal button { background: var(--accent); color: #1a1400; border: 0; border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .reveal .stats { color: var(--muted); font-size: 13px; margin-top: 12px; }

  footer { display: flex; gap: 8px; justify-content: space-between; margin-top: 28px; color: var(--muted); font-size: 12px; }
  footer button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1 id="worldName">…</h1>
    <div class="meta">
      <span class="credits" title="hint credits">⬡ <span id="credits">0</span></span>
      <span class="count"><span id="count">0</span> / <span id="total">0</span></span>
    </div>
  </header>

  <section class="goal">
    <div class="label">Goal</div>
    <div class="targets" id="goal"></div>
  </section>

  <section class="bench" id="bench">
    <div class="slot" id="slotA">tap a card</div>
    <div class="plus">+</div>
    <div class="slot" id="slotB">then another</div>
  </section>

  <section class="hints" id="hints">
    <button id="hintLeads" disabled>What does this lead to?</button>
    <button id="hintPairs" disabled>What goes with this?</button>
  </section>

  <section class="grid" id="grid"></section>

  <section class="hiddenwrap">
    <div class="label">Undiscovered · <span id="hiddenCount">0</span> <span class="sub">tap a square twice to learn its name</span></div>
    <div class="targets" id="named"></div>
    <div class="squares" id="hidden"></div>
  </section>

  <footer>
    <span id="elapsed"></span>
    <span>
      <button id="copyLog">Copy play log</button>
      <button id="reset">Reset</button>
    </span>
  </footer>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="reveal" id="reveal"></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
