<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<title>Alchemy</title>
<style>
  /* Sky (design/finish): the screen is the night the icons already live in. Nothing is boxed;
     things float on the dark. Glass is kept for what you act on: the bench, and a thing you
     know the name of. */
  :root {
    color-scheme: dark;
    --bg: #070913; --bg-2: #0e1428; --glass: rgba(14, 19, 38, .9); --line: rgba(160, 180, 255, .12);
    --text: #eef0fa; --muted: #8a92b4; --warm: #ffcf70; --warm-soft: rgba(255, 190, 90, .22); --bad: #ff6f7d;
    --sky:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent), radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent),
      radial-gradient(1px 1px at 55% 34%, #fff4 50%, transparent), radial-gradient(1px 1px at 30% 62%, #fff5 50%, transparent),
      radial-gradient(1px 1px at 88% 48%, #fff4 50%, transparent), radial-gradient(1px 1px at 8% 84%, #fff5 50%, transparent),
      radial-gradient(1.5px 1.5px at 66% 76%, #fff6 50%, transparent), radial-gradient(1px 1px at 42% 92%, #fff4 50%, transparent),
      radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%);
    --sky-size: 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 390px 520px, 100vw 100vh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background-color: var(--bg); color: var(--text); font: 15px/1.35 Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background-image: var(--sky); background-size: var(--sky-size); background-attachment: fixed; user-select: none; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }
  .ic { display: inline-block; flex: none; container-type: inline-size; }
  .ic svg { width: 100%; height: 100%; }
  /* A world without drawings yet shows its emoji, sized to whatever box the icon is given. */
  .ic .emoji { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 78cqw; line-height: 1; }
  .hex { width: 11px; height: 11px; display: inline-block; vertical-align: -1px; }
  main { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: env(safe-area-inset-top) calc(48px + env(safe-area-inset-bottom)); }

  .top { padding-block: 16px 8px; }
  .bar { display: flex; align-items: center; gap: 12px; position: relative; }
  h1 { flex: 1; margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .credits { display: inline-flex; align-items: center; gap: 4px; color: var(--warm); font-weight: 600; font-variant-numeric: tabular-nums; }
  .menu { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; border-radius: 50%; }
  .menu i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .sheet { position: absolute; right: 0; top: 40px; z-index: 20; display: flex; flex-direction: column; gap: 4px; padding: 8px;
    background: #121831; border: 1px solid var(--line); border-radius: 12px; min-width: 160px; box-shadow: 0 12px 32px #0008; }
  .sheet span { color: var(--muted); font-size: 13px; padding: 6px 10px; }
  .sheet button { text-align: left; padding: 8px 10px; border-radius: 8px; }
  .sheet button:hover, .worlds a:hover { background: #fff1; }
  .worlds { display: flex; flex-direction: column; gap: 4px; padding-block: 4px; margin-block: 4px; border-block: 1px solid var(--line); }
  .worlds a, .worlds .here { padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .worlds .here { color: var(--warm); }

  /* The goal, with progress as a ring round it and the count under its name. */
  .summit { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; column-gap: 12px; row-gap: 2px; margin-top: 12px; }
  .summit > .ic { grid-area: 1 / 1 / 3 / 2; width: 72px; height: 72px; padding: 10px; position: relative; }
  .summit > .ic svg { filter: drop-shadow(0 0 10px rgba(90, 170, 255, .35)); }
  .summit > .ic::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--warm) calc(var(--p) * 1turn), #ffffff14 0);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
  .goal { grid-area: 1 / 2; align-self: end; font-size: 24px; font-weight: 600; line-height: 1.1; }
  .progress { grid-area: 2 / 2; align-self: start; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress b { color: var(--text); font-weight: 600; }
  .summit.reached .progress { color: var(--warm); }
  .summit > .hint, .summit > .rec { grid-area: 1 / 3 / 3 / 4; }
  .hint { white-space: nowrap; font-size: 13px; color: var(--muted); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .rec { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; color: var(--muted); font-size: 14px; }
  .rec .ic { width: 22px; height: 22px; }
  .summit > .rec { flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13px; }
  .summit > .rec .plus { display: none; }
  .rec > span:not(.plus) { display: inline-flex; align-items: center; gap: 6px; }
  .summit.new > .hint, .summit.new > .rec, .named.new { animation: pop .4s; }

  /* The bench floats over the sky and stays: a pane of dark glass with three sockets carved into
     it. The depth is what makes them sockets; lightened, they turn into form fields. */
  .bench { position: sticky; top: 8px; z-index: 10; margin-top: 16px; display: grid; grid-template-columns: 1fr 16px 1fr 16px 1fr;
    align-items: center; gap: 4px; padding: 12px; border-radius: 20px; background: var(--glass);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 12px 32px #0006; }
  .bench.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .op { text-align: center; color: var(--muted); font-size: 16px; }
  .slot { height: 84px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    background: radial-gradient(60% 60% at 50% 45%, #ffffff08, transparent), #05070f80; box-shadow: inset 0 2px 8px #000a, inset 0 0 0 1px #ffffff0a; }
  .slot .ic { width: 44px; height: 44px; }
  .slot .nm { font-size: 12px; color: var(--muted); }
  .slot.result { box-shadow: inset 0 2px 8px #000a, inset 0 0 0 1px rgba(255, 207, 112, .2); }
  .slot.result:empty::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warm); opacity: .35; box-shadow: 0 0 12px var(--warm); }
  .slot.result.found { box-shadow: inset 0 0 0 1px var(--warm), 0 0 24px var(--warm-soft); }
  .slot.result.dud { box-shadow: inset 0 0 0 1px var(--bad), 0 0 20px rgba(255, 111, 125, .25); color: var(--bad); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; margin-top: 24px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; border-radius: 16px; position: relative; cursor: pointer; transition: transform .12s; }
  .card .ic { width: 52px; height: 52px; transition: transform .18s; }
  .card .n { font-size: 13px; color: #cfd4ea; text-align: center; line-height: 1.15; }
  .card:active { transform: scale(.94); }
  .card::before { content: ""; position: absolute; left: 50%; top: 58px; width: 56px; height: 12px; margin-left: -28px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--warm-soft), transparent); opacity: 0; transition: opacity .18s; }
  .card.picked .ic { transform: translateY(-6px) scale(1.06); }
  .card.picked::before { opacity: 1; }
  .card.picked .n { color: var(--warm); }
  .card.new { animation: pop .45s; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: none; opacity: 1; } }

  .dark { margin-top: 32px; }
  .dark:has(.marks:empty):has(.named-list:empty) { display: none; }
  .label { margin: 0 0 12px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  /* A thing you know the name of is the most actionable line on the screen, so it gets the
     bench's glass rather than sitting as a footnote among the unknowns. */
  .named { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; padding: 8px 14px 8px 8px; font-size: 14px;
    border-radius: 16px; background: var(--glass); border: 1px solid var(--line); }
  .named > .ic { width: 40px; height: 40px; }
  .named > .nm { font-weight: 600; font-size: 16px; }
  .named .eq, .plus { color: var(--muted); }
  /* A question mark says both "unknown" and "tap me"; it only loses the box round it. All alike,
     because a difference would read as meaning something. */
  .marks { display: flex; flex-wrap: wrap; gap: 10px; padding-block: 4px 8px; }
  .sq { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px var(--line); color: #8a92b4aa; font-size: 14px; }
  .sq.armed { width: auto; padding-inline: 12px; border-radius: 999px; color: var(--warm); font-size: 13px; box-shadow: inset 0 0 0 1px rgba(255, 207, 112, .4); }
  .note { font-size: 14px; color: var(--muted); margin-top: 8px; min-height: 20px; display: flex; align-items: center; gap: 6px; }
  .note .ic { width: 22px; height: 22px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: #121831; border: 1px solid var(--line); color: var(--muted);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; }

  /* ---------- the discovery moment ---------- */
  .stage { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 24px; cursor: pointer; overflow: hidden; }
  .stage.show { display: flex; }
  .backdrop { position: absolute; inset: 0; background: rgba(4, 5, 12, .92); animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .who { position: relative; text-align: center; max-width: 360px; width: 100%; }
  .pair { font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pair .ic { width: 22px; height: 22px; }
  .name { font-size: 32px; font-weight: 600; line-height: 1.15; margin-top: 8px; }
  .blurb { font-size: 16px; color: var(--text); margin-top: 16px; text-align: left; }
  .credit { display: inline-block; margin-top: 16px; font-size: 12px; color: var(--warm); border: 1px solid var(--warm); border-radius: 999px; padding: 4px 12px; }
  .credit.none { color: var(--muted); border-color: var(--line); }
  .stats { font-size: 14px; color: var(--muted); margin-top: 16px; }
  .in { opacity: 0; animation: rise .5s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .arena { position: relative; width: 100%; height: 200px; }
  .anchor { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .anchor > div { position: absolute; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .ing > div { width: 88px; height: 88px; margin: -44px; }
  .out > div { width: 150px; height: 150px; margin: -75px; }
  .ing .ic, .out .ic { width: 100%; height: 100%; }
  .flash > div { width: 24px; height: 24px; margin: -12px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px 20px rgba(255, 207, 112, .8); }
  .ring > div { width: 60px; height: 60px; margin: -30px; border-radius: 50%; border: 2px solid var(--warm); }
  .glow > div { width: 180px; height: 180px; margin: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 207, 112, .45), rgba(255, 207, 112, 0) 70%); }
  .spark > div { width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--warm); }

  /* first launch: who's playing */
  .stage.form { cursor: default; }
  .stage.form .who { background: #121831; border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; animation: pop .35s; }
  .stage.form .who > .ic { display: block; width: 72px; height: 72px; margin: 0 auto; }
  .stage.form h2 { margin: 8px 0 4px; font-size: 24px; font-weight: 600; }
  .stage.form p { color: var(--muted); font-size: 14px; margin: 8px 0 16px; }
  .stage.form form { display: flex; gap: 8px; }
  .stage.form input { flex: 1; min-width: 0; background: #05070f; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }
  .stage.form button { background: var(--warm); color: #1a1400; border-radius: 12px; padding: 10px 20px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="bar">
      <h1 id="worldName">…</h1>
      <span class="credits" title="Hint credits"><svg class="hex" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8l4.5 2.6v5.2L6 11.2 1.5 8.6V3.4z" fill="currentColor"/></svg><b id="credits">0</b></span>
      <button class="menu" id="menuBtn" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
      <div class="sheet" id="sheet" hidden><span id="elapsed"></span><div class="worlds" id="worlds"></div><button id="copyLog">Copy play log</button><button id="reset">Start over</button></div>
    </div>
    <div class="summit" id="goal"></div>
  </header>

  <section class="bench" id="bench">
    <div class="slot" id="slotA"></div><div class="op">+</div>
    <div class="slot" id="slotB"></div><div class="op">=</div>
    <div class="slot result" id="result"></div>
  </section>

  <section class="grid" id="grid"></section>

  <section class="dark">
    <h2 class="label" id="hiddenLabel"></h2>
    <div class="named-list" id="named"></div>
    <div class="marks" id="hidden"></div>
    <div class="note" id="note"></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="stage" id="stage"></div>

<script type="module" src="app.js"></script>
</body>
</html>
